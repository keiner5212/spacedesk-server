# Configuracion del servidor spacedesk-linux.
# Todo lo ajustable esta aca: no hace falta tocar codigo.

[server]
# Puerto TCP de datos y UDP de discovery (28252 es el que espera la app spacedesk).
port = 28252
# DEBUG | INFO | WARNING | ERROR
log_level = INFO
# Nombre que muestra la app en la lista de servidores descubiertos.
name = spacedesk-linux

[capture]
# Tamano del framebuffer que ve la tablet. La app NO escala: muestra el frame a
# 1:1, asi que este numero es el que aparece en pantalla. Bajarlo es la palanca
# mas efectiva contra el lag (menos pixeles que codificar y menos bytes).
width = 1600
height = 900

# Calidad JPEG del frame. Mas alto = mas nitido y mas pesado por WiFi.
jpeg_quality = 55

# Ajuste automatico de la calidad para llegar a los FPS objetivo. El protocolo
# obliga a esperar el ACK antes de mandar el siguiente frame, asi que fps es
# aproximadamente 1/latencia: cada byte extra se paga en tiempo de ida y vuelta.
# Ponelo en false para fijar la calidad a mano.
adaptive_quality = true
# Piso de calidad. Medido en la tablet: cada KB de mas cuesta ~0,13 ms de
# latencia, sobre un piso fijo de ~45 ms. Traducido: subir la calidad de 50 a
# 80 cuesta unos 5 ms (de 21 a 19 fps) y se nota mucho mas limpio.
jpeg_quality_min = 50
jpeg_quality_max = 90
# FPS objetivo. Si se queda corto aun con la calidad en el minimo, lo que queda
# es bajar capture.width/height.
target_fps = 30

# Cada reenvio del MISMO frame gasta un round trip completo, y ese round trip es
# justo donde se encola el proximo frame con contenido real. Mientras la pantalla
# esta estatica, reenviar 15 veces por segundo no aporta nada y retrasa el primer
# frame de verdad. Con 500 ms la app sigue viendo trafico y el frame con novedad
# sale de inmediato. 0 desactiva el keep-alive (puede quejarse de ancho de banda).
keepalive_ms = 500

# Frames sin confirmar a la vez. El protocolo manda 1: cada frame espera su
# ACK, y con la latencia que impone la tablet (~45 ms) eso pone el techo en
# ~22 fps. Con 2 se duplica el techo, a costa de meterle frames por delante de
# su confirmacion: si la imagen se rompe o se ve a saltos, volvelo a 1.
in_flight_frames = 2

# Cursor del mouse: 1 = oculto, 2 = dibujado en los pixeles del frame,
# 4 = el cliente tiene que dibujarlo con la metadata del stream.
cursor_mode = 2

# Tipo de fuente del portal ScreenCast:
#   4 = VIRTUAL: monitor virtual real de KWin (se le pueden mover ventanas).
#   1 = MONITOR: espeja un monitor fisico ya existente.
#   5 = cualquiera de los dos (el dialogo del portal deja elegir).
source_type = 4

# Recordar la autorizacion del portal (persist_mode + restore_token) para que
# el dialogo de permisos no aparezca en cada arranque. Requiere KDE Connect /
# xdg-desktop-portal-kde compatible; si no lo acepta se vuelve a mostrar.
persist_permissions = true

[discovery]
# Responder los broadcasts UDP de la app para que encuentre el servidor solo.
# Sin tocar: la app oficial es intermitente porque su socket receptor solo vive
# ~300 ms por ronda. Se contesta a CADA request sin cooldown, porque los manda
# de a 5 por redundancia y el WiFi se pierde paquetes. Cualquier "optimizacion"
# aca (dedup, cooldown, menos respuestas) la empeora.
enabled = true
