# Configuracion del servidor spacedesk-linux.
# Todo lo ajustable esta aca: no hace falta tocar codigo.

[server]
# Puerto TCP de datos y UDP de discovery (28252 es el que espera la app spacedesk).
port = 28252
# DEBUG | INFO | WARNING | ERROR
log_level = INFO

[capture]
# Tamano del framebuffer que ve la tablet. La app NO escala: muestra el frame a
# 1:1, asi que este numero es el que aparece en pantalla.
width = 1920
height = 1200

# Calidad JPEG del frame. Mas alto = mas nitido y mas pesado por WiFi.
# 55-75 para WiFi, 90-100 para red muy rapida o uso mayoritariamente por cable.
jpeg_quality = 55

# Cursor del mouse: 1 = oculto, 2 = dibujado en los pixeles del frame,
# 4 = el cliente tiene que dibujarlo con la metadata del stream.
cursor_mode = 2

# Tipo de fuente del portal ScreenCast:
#   4 = VIRTUAL: monitor virtual real de KWin (se le pueden mover ventanas).
#   1 = MONITOR: espeja un monitor fisico ya existente.
#   5 = cualquiera de los dos (el dialogo del portal deja elegir).
source_type = 4

# Recordar la autorizacion del portal (persist_mode + restore_token) para que
# el dialogo de permisos no aparezca en cada arranque. Requiere KDE Connect /
# xdg-desktop-portal-kde compatible; si no lo acepta se vuelve a mostrar.
persist_permissions = true

[discovery]
# Responder los broadcasts UDP de la app para que encuentre el servidor solo.
# Con false hay que poner la IP a mano en la app.
enabled = true